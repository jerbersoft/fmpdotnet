name: CI

# The gate in front of a package other people will depend on.
#
# The build runs under TreatWarningsAsErrors (Directory.Build.props) covering NU* as well as CS*, so a new
# compiler warning OR a newly-published advisory against any package — direct or transitive — fails this job
# rather than adding a line nobody reads.
#
# It also carries the trim/AOT analysers for free. The library declares IsAotCompatible, which turns IL2026 and
# IL3050 into build errors: any reflection-based JSON or configuration binding that creeps back in fails HERE,
# not months later in a consumer's trimmed publish. That is not a theoretical guard — those two errors are what
# forced the source-generated JsonSerializerContext and the by-name options binding in the first place.
#
# Deliberately NOT here: the live API. That is smoke.yml, which runs weekly against a real key (#26). It is
# separate because its answer changes with the market rather than with the commit, so running it on push would
# report yesterday's earnings calendar as a regression in today's diff — and because its bulk tier spends the
# key's standing, which FMP restricts keys for.
#
# The solution-wide `dotnet test` below DOES build and run FmpDotNet.SmokeTests, and that is intended. Its live
# tests skip themselves when FMP_API_KEY is unset, which it is here, so no request goes out. What does run is
# its handful of offline tests: that the sweep can still reach every endpoint, so a new one cannot silently
# fall out of the weekly run, and that a failed sweep cannot record itself as the baseline, which would leave
# the weekly run green precisely because an endpoint had broken. Both fail on the commit that caused them
# rather than on the next Monday.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:      # so a run can be forced without pushing a commit

# This repository is PRIVATE, so runner minutes are billed rather than free. Superseded runs on a branch are
# cancelled; master is exempt because its runs are the record for a merged commit and should complete even if
# another merge lands behind them.
#
# Branch pushes are built, not just PRs, because work here happens on feature branches that may sit for a while
# before one is opened — CI that only runs at PR time would leave the branch unverified for exactly the period
# when the feedback is worth most. A branch that later gets a PR is therefore built twice; on a repo this size
# that is a few minutes, and it buys immediate feedback on every push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read          # least privilege — nothing here writes to the repo

jobs:
  dotnet:
    name: .NET — build + test
    runs-on: ubuntu-latest
    # Explicit, because the GitHub default is 360 minutes. On a billed private repo a single hung step would
    # otherwise burn six hours of minutes before anyone noticed.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # No dotnet-version here: global.json pins the SDK feature band, so the runner and a developer's machine
      # resolve the same compiler. Passing a version as well would let the two disagree silently.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # setup-dotnet's own `cache: true` keys off packages.lock.json, which this repo does not use, so it would
      # silently cache nothing. Key off the project files instead.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore FmpDotNet.slnx

      - name: Build
        run: dotnet build FmpDotNet.slnx --no-restore

      # `-- RunConfiguration.TreatNoTestsAsError=true` is the part that makes this step a gate rather than a
      # formality. VSTest treats "discovery selected zero tests" as a WARNING and still exits 0, so without it a
      # green tick can mean nothing ran at all — a renamed test project, a broken discovery, or a filter typo all
      # reach that state. The setting makes zero selected tests exit 1 instead, per project.
      #
      # Plain `--logger trx`, with no --results-directory: with a solution every project would otherwise write
      # its trx to the same path under the same name and only the last to finish would survive.
      - name: Test
        run: dotnet test FmpDotNet.slnx --no-build --logger trx -- RunConfiguration.TreatNoTestsAsError=true

      # Failure only. These are read when something broke; uploading them on every green run bills artifact
      # storage on a private repo for files nobody opens.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: '**/TestResults/*.trx'
          retention-days: 14

  # Publishes the SDK to this repository's GitHub Packages NuGet feed, which is how `trader` consumes it (#10).
  #
  # Only on master, and only after the build+test job is green — a package that exists is a package someone can
  # restore, so publishing an unverified one is worse than publishing nothing.
  #
  # VERSIONING. Every push publishes 0.1.0-ci.<run number>. Two facts force this shape:
  #   * GitHub Packages REFUSES to overwrite an existing NuGet version. A fixed 0.1.0 would publish once and
  #     then fail this job on every subsequent push — a red CI that means nothing.
  #   * A consumer pinning an exact prerelease gets a build that cannot drift. `trader` pins one, so "which SDK
  #     did this trader commit build against" is answerable from trader's own git history.
  # `github.run_number` increments per workflow run and never resets, so versions are monotonic. A RE-RUN keeps
  # the same number, which is why --skip-duplicate is here: re-running a green build should be a no-op, not a
  # failure. A hand-cut release later packs without the suffix, and plain 0.1.0 outranks every 0.1.0-ci.N.
  #
  # No PAT. GITHUB_TOKEN can write to its OWN repository's package registry given `packages: write`. Trader's
  # CI reads this feed with ITS own GITHUB_TOKEN, which works because this package grants the trader repository
  # read access under the package's "Manage Actions access" setting — a one-off grant in the package settings,
  # not a secret in either repo. That is the only manual step in the whole chain.
  publish:
    name: Publish to GitHub Packages
    needs: dotnet
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write       # the one privilege above the workflow-level default, and only for this job

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # `dotnet pack` builds Release from scratch here rather than reusing the test job's output: jobs run on
      # separate runners, and shipping an artifact between them to save one compile of a five-file library would
      # cost more in moving parts than it saves.
      #
      # This produces a .snupkg beside the .nupkg, and the build is deterministic here and only here: the project
      # sets ContinuousIntegrationBuild when GITHUB_ACTIONS is true, which normalises source paths so the same
      # commit packs to the same bytes on any runner.
      - name: Pack
        run: dotnet pack src/FmpDotNet/FmpDotNet.csproj -c Release -o ./artifacts -p:VersionSuffix=ci.${{ github.run_number }}

      # --no-symbols is not a preference, it is what this feed supports. Checked against the registry's own
      # service index, which advertises PackagePublish/2.0.0 and no SymbolPackagePublish resource of any version:
      # GitHub Packages runs no symbol server. Left implicit, `dotnet nuget push` looks for that resource, fails
      # to find it, and warns on every publish about something that cannot be fixed here.
      #
      # The symbols are not lost — the .snupkg is uploaded below. Source Link stamps the commit into those PDBs,
      # so loading them from the artifact gives a debugger the exact source for the binary it is stepping through.
      # If this package ever goes to nuget.org, which does run a symbol server, drop this flag.
      - name: Push
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
          --no-symbols

      - name: Upload symbol package
        uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ github.run_number }}
          path: ./artifacts/*.snupkg
          retention-days: 90
