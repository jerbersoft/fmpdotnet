name: CI

# The gate in front of a package other people will depend on.
#
# The build runs under TreatWarningsAsErrors (Directory.Build.props) covering NU* as well as CS*, so a new
# compiler warning OR a newly-published advisory against any package — direct or transitive — fails this job
# rather than adding a line nobody reads.
#
# It also carries the trim/AOT analysers for free. The library declares IsAotCompatible, which turns IL2026 and
# IL3050 into build errors: any reflection-based JSON or configuration binding that creeps back in fails HERE,
# not months later in a consumer's trimmed publish. That is not a theoretical guard — those two errors are what
# forced the source-generated JsonSerializerContext and the by-name options binding in the first place.
#
# Deliberately NOT here either, since #73: publishing. That is publish.yml, which packs and pushes to nuget.org
# after this workflow passes on master, and on a published GitHub Release for a stable version. It is a separate
# file because nuget.org's Trusted Publishing policy binds to a workflow file by name, so the workflow that pushes
# has to be the one the policy names.
#
# Deliberately NOT here: the live API. That is smoke.yml, which runs weekly against a real key (#26). It is
# separate because its answer changes with the market rather than with the commit, so running it on push would
# report yesterday's earnings calendar as a regression in today's diff — and because its bulk tier spends the
# key's standing, which FMP restricts keys for.
#
# The solution-wide `dotnet test` below DOES build and run FmpDotNet.SmokeTests, and that is intended. Its live
# tests skip themselves when FMP_API_KEY is unset, which it is here, so no request goes out. What does run is
# its handful of offline tests: that the sweep can still reach every endpoint, so a new one cannot silently
# fall out of the weekly run, and that a failed sweep cannot record itself as the baseline, which would leave
# the weekly run green precisely because an endpoint had broken. Both fail on the commit that caused them
# rather than on the next Monday.
#
# THE JOB NAME BELOW IS LOAD-BEARING. `master` carries a repository ruleset (#22) that requires the check
# `.NET — build + test` to pass before a pull request can merge, and a required check is matched by NAME. Rename
# the job and the rule stops matching: GitHub does not report an error, it reports a check that is "expected" and
# never arrives, so every PR waits forever on something that already passed under a different name. If this job
# is ever renamed, update the ruleset in the same change —
# `gh api repos/jerbersoft/fmpdotnet/rulesets` lists it.
#
# The ruleset also blocks force-push and deletion on master, and requires a pull request with zero approvals, so
# the normal path is branch -> PR -> green -> merge. The repository admin role is on the bypass list, so a direct
# push to master is still possible deliberately; it is an escape hatch rather than the route. Verified on
# 2026-08-27 by removing the bypass and pushing: the push was rejected with GH013, naming both the pull-request
# rule and this check.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:      # so a run can be forced without pushing a commit

# Superseded runs on a branch are cancelled: a run of a commit that has already been replaced answers a question
# nobody is still asking, whatever the minutes cost (nothing — the repository is public). master is exempt because
# its runs are the record for a merged commit and should complete even if another merge lands behind them.
#
# Branch pushes are built, not just PRs, because work here happens on feature branches that may sit for a while
# before one is opened — CI that only runs at PR time would leave the branch unverified for exactly the period
# when the feedback is worth most. A branch that later gets a PR is therefore built twice; on a repo this size
# that is a few minutes, and it buys immediate feedback on every push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read          # least privilege — nothing here writes to the repo

jobs:
  dotnet:
    name: .NET — build + test
    runs-on: ubuntu-latest
    # Explicit, because the GitHub default is 360 minutes. A single hung step would otherwise sit for six hours
    # before anyone noticed.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # No dotnet-version here: global.json pins the SDK feature band, so the runner and a developer's machine
      # resolve the same compiler. Passing a version as well would let the two disagree silently.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # setup-dotnet's own `cache: true` keys off packages.lock.json, which this repo does not use, so it would
      # silently cache nothing. Key off the project files instead.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore FmpDotNet.slnx

      - name: Build
        run: dotnet build FmpDotNet.slnx --no-restore

      # `-- RunConfiguration.TreatNoTestsAsError=true` is the part that makes this step a gate rather than a
      # formality. VSTest treats "discovery selected zero tests" as a WARNING and still exits 0, so without it a
      # green tick can mean nothing ran at all — a renamed test project, a broken discovery, or a filter typo all
      # reach that state. The setting makes zero selected tests exit 1 instead, per project.
      #
      # Plain `--logger trx`, with no --results-directory: with a solution every project would otherwise write
      # its trx to the same path under the same name and only the last to finish would survive.
      - name: Test
        run: dotnet test FmpDotNet.slnx --no-build --logger trx -- RunConfiguration.TreatNoTestsAsError=true

      # Failure only. These are read when something broke; uploading them on every green run would store
      # artifacts nobody opens.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: '**/TestResults/*.trx'
          retention-days: 14
