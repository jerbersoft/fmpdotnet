name: Live smoke

# Calls the REAL FMP API and checks that what comes back still matches what the SDK was built against (#26).
#
# WHY THIS IS A SEPARATE WORKFLOW. The unit suite runs entirely on stubs, and a stub keeps saying what it always
# said. Nothing in ordinary CI can notice FMP renaming a field, moving a plan gate, or changing a media type —
# and a renamed field does not even fail: almost every model property is nullable and not `required`, so
# System.Text.Json quietly deserialises the missing name to null and the rows keep arriving looking correct.
# That is the failure this workflow exists to catch, and it can only be caught against the live API.
#
# WHY IT IS NOT ON PUSH. It costs calls from a real key on every run, and the answer changes with the market
# rather than with the commit — so a push-triggered run would report yesterday's earnings calendar as a
# regression in today's diff.
#
# WHY IT IS NO LONGER ON A SCHEDULE. It ran Mondays at 06:17 UTC until 2026-09-09. The cadence was retired
# because it paid a real price for a signal nobody received. Every run spent a live key's standing with FMP, and
# a scheduled failure is only ever emailed to whoever last touched the cron — so when the key itself started
# being rejected on 2026-08-31, the suite reported eighty endpoints "changing shape" and it went unnoticed for a
# fortnight. A check whose failures nobody reads is not a check; it is a bill.
#
# Drift in FMP's responses does not arrive on a weekly clock either. It is worth looking for when a release is
# being cut, or when something already looks wrong — both moments when somebody is actually reading the result.
# That is what dispatch is for: Actions → Live smoke → Run workflow.

on:
  workflow_dispatch:
    inputs:
      bulk:
        description: 'Also probe the *-bulk endpoints (~8 minutes, and spends the key''s standing — see below)'
        type: boolean
        default: false

# One live run at a time. Two concurrent runs would share the key but not the SDK's token bucket, which paces
# itself per process — so they would emit at twice the rate the throttle was measured to be safe at.
concurrency:
  group: smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Live API shapes
    runs-on: ubuntu-latest
    # Generous, because the bulk tier is deliberately slow: the SDK's bulk token bucket refills at two calls a
    # minute, so twenty probes are about eight minutes of mostly waiting (measured 2026-08-26: 8 m 4 s). The
    # ordinary tier is not throttled that way and takes seconds — 67 endpoints in 17 s, measured 2026-08-27.
    #
    # That tier grew from 21 endpoints to 49 when Quote and Chart landed (#24), and from 5 s to 13. Most of the
    # added time is bytes rather than requests: seven of the new endpoints download a whole asset class, and the
    # full-shape ETF quote alone is 6.6 MB. Probing them anyway is deliberate — an endpoint the sweep skips is an
    # endpoint whose renamed field goes unnoticed until a consumer hits it.
    #
    # It grew again, from 49 to 67, when Directory and Search landed (#25) — 17 new paths, but 18 new methods:
    # cik-list gets both a paged GetCikListAsync and a walking StreamCikListAsync — and from 13 s to 17. Four of
    # the eighteen are whole-universe downloads too — financial-statement-symbol-list (68,200 rows), etf-list
    # (14,567), earnings-transcript-list (11,178) and cryptocurrency-list (4,793) — so, as before, this growth is
    # bytes rather than requests.
    #
    # The margin is not padding. A 200-row bulk sample, tried once, took 2 h 39 m; the sample is back down to 25
    # for exactly that reason (see Probe.StreamSample). If a run ever approaches this ceiling, the sample size or
    # FMP's bulk throughput has changed, and killing the job is the right answer — a bulk sweep that runs for
    # hours is spending the key's standing with FMP the whole time. 17 s of ordinary work does not move that
    # ceiling, so it stays at 25.
    timeout-minutes: 25

    env:
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      # The bulk endpoints are excluded unless someone dispatching the workflow ticks the box. FMP's own throttle
      # message warns that "frequent abuse on this API Endpoint may result in restrictions placed on this API
      # Key", so the cost of running them often is the key itself, not the runner minutes. Empty string, not
      # 'false': the suite tests for presence.
      FMPDOTNET_SMOKE_BULK: ${{ inputs.bulk && '1' || '' }}

    steps:
      - uses: actions/checkout@v7

      # Without this the whole job passes by doing nothing. Every live test skips itself when FMP_API_KEY is
      # unset — which is what makes a keyless checkout run green offline — so a missing secret would turn this
      # workflow into a green tick that never called anything.
      #
      # It checks presence, NOT validity: a key FMP rejects passes this guard and then fails downstream as
      # eighty endpoints all "changing shape" at once, which is what happened from 2026-08-31. If this workflow
      # ever goes back on a schedule, make this a one-request pre-flight first.
      - name: Require the API key
        run: |
          if [ -z "$FMP_API_KEY" ]; then
            echo "::error::FMP_API_KEY is not set for this repository. Every live test would skip and this job would pass without having called FMP at all. Add the secret, or disable this workflow."
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Only the smoke project. Building the solution would drag the stub suite along for no benefit; it already
      # runs on every push in ci.yml.
      - name: Test
        run: >
          dotnet test tests/FmpDotNet.SmokeTests/FmpDotNet.SmokeTests.csproj
          --logger trx
          -- RunConfiguration.TreatNoTestsAsError=true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results-${{ github.run_number }}
          path: '**/TestResults/*.trx'
          retention-days: 30
